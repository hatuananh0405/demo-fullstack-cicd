apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: default
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: backend-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
      annotations:
        # Kích hoạt bộ tiêm tự động OpenTelemetry Node.js
        instrumentation.opentelemetry.io/inject-nodejs: "default/backend-autoinstrumentation"
    spec:
      containers:
      - name: backend
        image: DOCKERHUB_PLACEHOLDER/lab14-backend:latest
        imagePullPolicy: Always
        
        # 🎯 SỬA 1: Ép chạy trực tiếp bằng node để triệt tiêu nodemon, giúp nạp biến NODE_OPTIONS sạch 100%
        command: ["node"]
        args: ["src/index.js"]
        
        ports:
        - containerPort: 5000
        env:
        # 🎯 SỬA 2: XÓA BỎ các biến OTEL_EXPORTER thủ công trỏ về Tempo cũ.
        # Hãy để OpenTelemetry Operator tự động gài các biến trỏ sang OTel Collector theo đúng file otel-instrumentation.yaml
        - name: OTEL_SERVICE_NAME
          value: "backend-app"
        
        # Giữ nguyên cấu hình kết nối Database nghiệp vụ của bạn
        - name: DB_HOST
          value: "mysql-svc"
        - name: DB_USER
          value: "user"
        - name: DB_PASSWORD
          value: "userpassword"
        - name: DB_NAME
          value: "my_database"
        - name: PORT
          value: "5000"