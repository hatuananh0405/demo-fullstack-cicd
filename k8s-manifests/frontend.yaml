apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: default
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: frontend-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
      - name: frontend
        # Tag image này cũng sẽ được cập nhật động theo mã commit sha nhằm chống kẹt cache của K8s Node
        image: DOCKERHUB_PLACEHOLDER/lab14-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000