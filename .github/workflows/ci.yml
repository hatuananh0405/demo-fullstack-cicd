name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  # -------------------------------------------------------
  # JOB 1: QUÉT BẢO MẬT MÃ NGUỒN TĨNH (Lint + Secret + SAST)
  # -------------------------------------------------------
  security-and-saast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Đọc lịch sử git để SonarCloud tính toán blame code

      # 1.1 Quét lộ thông tin mật (Mật khẩu, Token, Key...)
      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1.2 Quét mã nguồn tĩnh bằng SonarCloud
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # -------------------------------------------------------
  # JOB 2: ĐÓNG GÓI VÀ QUÉT BẢO MẬT CONTAINER (Build + Trivy + Push)
  # -------------------------------------------------------
  build-and-push-registry:
    needs: security-and-saast # Chỉ chạy khi JOB 1 vượt qua an toàn (Pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2.1 Build thử Image Backend để lưu tạm trên máy ảo Runner
      - name: Build Backend Image Local
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab11-backend:test

      # 2.2 Quét lỗ hổng bảo mật của Image bằng Trivy Scan
      - name: Run Trivy Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/lab11-backend:test'
          format: 'table'
          exit-code: '1' # Ép sập Pipeline nếu phát hiện lỗi bảo mật mức CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # 2.3 Đăng nhập vào Docker Hub công khai
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2.4 Đẩy chính thức Image lên Registry sau khi đã kiểm duyệt sạch sẽ
      - name: Push Backend Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab11-backend:development-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab11-backend:${{ github.sha }}

      # 2.5 BẮN TÍN HIỆU WEBHOOK GỌI JENKINS CD CHẠY LIVE
      
      - name: Trigger Jenkins CD Pipeline
        env:
          
          JENKINS_USER: "admin"
          JENKINS_SECRET_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          JENKINS_TARGET_URL: ${{ secrets.JENKINS_URL }}
        run: |
          # Dùng biến môi trường để gọi, file YAML hoàn toàn sạch chữ thường
          curl -X POST -u "$JENKINS_USER:$JENKINS_SECRET_TOKEN" "$JENKINS_TARGET_URL/job/pipeline-cd-distributed/build"