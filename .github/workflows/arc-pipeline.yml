name: Lab 14 ARC K8s Local Private Registry Pipeline

on:
  push:
    branches: [ "develop" ]

env:
  LOCAL_REGISTRY: "172.16.5.201:5000"

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # KHỞI TẠO ĐỘNG CƠ BUILDX VÀ SỬA LỖI PROTOCOL HTTPS
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        config-inline: |
          [registry."172.16.5.201:5000"]
            http = true
            insecure = true

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.LOCAL_REGISTRY }}/lab11-backend:${{ github.sha }}
          ${{ env.LOCAL_REGISTRY }}/lab11-backend:development-latest

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.LOCAL_REGISTRY }}/lab11-frontend:${{ github.sha }}
          ${{ env.LOCAL_REGISTRY }}/lab11-frontend:development-latest

    - name: Apply Deployments to Kubernetes Cluster
      run: |
        kubectl apply -f k8s/01-db.yaml
        kubectl apply -f k8s/02-backend.yaml
        kubectl apply -f k8s/03-frontend.yaml
        
        kubectl set image deployment/nodejs-deployment nodejs-api=${{ env.LOCAL_REGISTRY }}/lab11-backend:${{ github.sha }} -n lab14-app
        kubectl set image deployment/frontend-deployment frontend-app=${{ env.LOCAL_REGISTRY }}/lab11-frontend:${{ github.sha }} -n lab14-app
        
        kubectl rollout status deployment/nodejs-deployment -n lab14-app --timeout=90s
        kubectl rollout status deployment/frontend-deployment -n lab14-app --timeout=90s

# [BỔ SUNG BƯỚC NÀY] CÀI ĐẶT KUBECTL PHỤC VỤ CHO QUÁ TRÌNH DEPLOY
    - name: Install and Setup kubectl Tool
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    # TRIỂN KHAI XUỐNG CỤM K8S LIVE (BƯỚC CŨ)
    - name: Apply Deployments to Kubernetes Cluster
      run: |
        kubectl apply -f k8s/01-db.yaml
        kubectl apply -f k8s/02-backend.yaml
        kubectl apply -f k8s/03-frontend.yaml
        
        kubectl set image deployment/nodejs-deployment nodejs-api=${{ env.LOCAL_REGISTRY }}/lab11-backend:${{ github.sha }} -n lab14-app
        kubectl set image deployment/frontend-deployment frontend-app=${{ env.LOCAL_REGISTRY }}/lab11-frontend:${{ github.sha }} -n lab14-app
        
        kubectl rollout status deployment/nodejs-deployment -n lab14-app --timeout=90s
        kubectl rollout status deployment/frontend-deployment -n lab14-app --timeout=90s