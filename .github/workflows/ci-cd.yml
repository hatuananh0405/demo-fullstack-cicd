#ci-cd.yml
name: Lab 14 Full GitOps Pipeline (ARC Mode)

on:
  push:
    branches: [ "develop" ] # Chỉ kích hoạt khi bạn push code vào nhánh develop

jobs:
  build-and-deploy:
    # Buộc job chạy biệt lập trên Pod Runner tự động sinh bởi ARC ngay trong cụm K8s On-Premises của bạn
    runs-on: [self-hosted, kubernetes]

    steps:
    # Bước 1: Kéo (Clone) toàn bộ mã nguồn dự án từ GitHub vào workspace nội bộ của Pod Runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 2: Đăng nhập vào Docker Hub sử dụng Token bí mật lưu tại Repository Secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Bước 3: Đóng gói mã nguồn Backend bằng Docker-in-Docker (DinD) của Pod ARC và đẩy lên Hub
    - name: Build and Push Backend Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/lab14-backend:${{ github.sha }} ./backend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/lab14-backend:${{ github.sha }}

    # Bước 4: Đóng gói mã nguồn Frontend bằng Docker-in-Docker (DinD) của Pod ARC và đẩy lên Hub
    - name: Build and Push Frontend Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/lab14-frontend:${{ github.sha }} ./frontend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/lab14-frontend:${{ github.sha }}

    # Bước 5: Cập nhật trực tiếp Deployment lớp ứng dụng vào cụm K8s
    - name: Deploy to Kubernetes Cluster
      run: |
        # 5.1 Tải và cài đặt kubectl nhanh trực tiếp vào bên trong Pod Runner
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x ./kubectl
        
        # 5.2 Thực hiện thay đổi chuỗi 'DOCKERHUB_PLACEHOLDER' thành tài khoản thật kèm commit SHA
        sed -i "s|DOCKERHUB_PLACEHOLDER/lab14-backend:latest|${{ secrets.DOCKERHUB_USERNAME }}/lab14-backend:${{ github.sha }}|g" k8s-manifests/backend.yaml
        sed -i "s|DOCKERHUB_PLACEHOLDER/lab14-frontend:latest|${{ secrets.DOCKERHUB_USERNAME }}/lab14-frontend:${{ github.sha }}|g" k8s-manifests/frontend.yaml
        
        # 5.3 Sử dụng file binary ./kubectl vừa tải để apply cấu hình mới vào cụm
        ./kubectl apply -f k8s-manifests/backend.yaml
        ./kubectl apply -f k8s-manifests/frontend.yaml
        
        # Đợi các Deployment layer hoàn tất cập nhật trạng thái
        ./kubectl rollout status deployment/backend-deployment -n default
        ./kubectl rollout status deployment/frontend-deployment -n default